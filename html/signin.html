<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In - UniOn</title>
	<link rel="stylesheet" href="../styles.css">
	<link rel="manifest" href="../manifest.json">
	<link rel="icon" type="image/png" sizes="192x192" href="../photos/pwa-icon-192.png">
	<link rel="apple-touch-icon" href="../photos/apple-touch-icon.png">
	<meta name="theme-color" content="#0d6efd">
</head>
<body class="pageShell">
	<div class="topbarContainer">
		<div class="topbarLeftContainer">
			<a href="../index.html" aria-label="UniOn Home">
				<img src="../photos/logo-png.png" alt="UniOn Logo" class="topbarLogoImage">
			</a>
		</div>
		<div class="topbarNavbarContainer">
			<a href="../index.html"><span class="baseText">მთავარი</span></a>
			<a href="./university.html"><span class="baseText">უნივერსიტეტები</span></a>
			<a href="./projects.html"><span class="baseText">პროექტები</span></a>
			<a href="./lectures.html"><span class="baseText">ლექციები</span></a>
			<a href="./aboutus.html"><span class="baseText">ჩვენ შესახებ</span></a>
			<a href="./contact.html"><span class="baseText">კონტაქტი</span></a>
		</div>
		<div class="topbarRightContainer">
			<a href="./signin.html">
				<button class="loginButton">Sign In</button>
			</a>
		</div>
	</div>

	<main class="signinWrap pageGrow">
		<section class="signinCard">
			<img src="../photos/logo.png" alt="UniOn Logo" class="signinLogo">
			<h2 class="baseText pageTitle">Sign In To UniOn</h2>
			<button id="googleSignInBtn" class="socialButton googleButton">Log In Via Google</button>
			<button id="facebookSignInBtn" class="socialButton facebookButton">Log In Via Facebook</button>
			<p id="signinStatus" class="signinStatus baseText">Choose a provider to continue.</p>
			<button id="signOutBtn" class="socialButton signOutButton" style="display:none;">Sign Out</button>
		</section>
	</main>

	<footer class="siteFooter">
		<div class="footerLogoBlock">
			<img src="../photos/logo-png.png" alt="UniOn Logo" class="footerLogoImage">
		</div>
		<div class="footerColumns">
			<div>
				<h3 class="baseText footerColTitle">ლინკები</h3>
				<a href="./aboutus.html"><p class="footerText">ჩვენს შესახებ</p></a>
				<a href="./contact.html"><p class="footerText">კონტაქტი</p></a>
			</div>
			<div>
				<h3 class="baseText footerColTitle">Contact</h3>
				<p class="footerText">&#9993; : hello@union.example</p>
				<p class="footerText">&#9743; : +995 555 12 34 56</p>
			</div>
		</div>
	</footer>

	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('../service-worker.js', { updateViaCache: 'none' });
			});
		}
	</script>
	<script src="../scripts.js"></script>
</body>
</html>
